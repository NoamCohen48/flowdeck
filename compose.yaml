# Flowdeck — the whole system.
#
#   postgres  the database, with logical replication so Electric can follow it
#   electric  syncs Postgres queries to the browser as "shapes" (the live read path)
#   app       Hono API + the built React frontend; all writes go through here
#   caddy     one origin, TLS in front of everything
#   backup    pg_dump + the data volume, shipped to S3 with restic (docs/backup.md)
#
# The app proxies shape requests rather than exposing Electric directly, so there is
# one place that decides what a client may subscribe to.
#
# app and backup name both a published image and the source that builds it. From a
# release bundle (no source next to this file) `docker compose up` pulls the image;
# in the repository `docker compose up --build` builds it from the working tree.
# FLOWDECK_VERSION picks the release; `latest` is the newest tagged one.

name: flowdeck

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowdeck-dev}
      POSTGRES_DB: flowdeck
    # wal_level=logical is what lets Electric follow changes. Without it Electric
    # starts and then fails on its first shape, which is a confusing way to find out.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-54321}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdeck -d flowdeck"]
      interval: 3s
      timeout: 3s
      retries: 20

  electric:
    image: electricsql/electric:1.8.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://flowdeck:${POSTGRES_PASSWORD:-flowdeck-dev}@postgres:5432/flowdeck?sslmode=disable
      ELECTRIC_INSECURE: "true" # not exposed publicly; the app proxies and authorises
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ELECTRIC_PORT:-3010}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/v1/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The API tests' own Electric, following the flowdeck_test database so a test
  # run never writes into the development data. Only with `--profile test`;
  # `bun run test:setup` starts it. A replication stream id of its own, because
  # replication slot names are per Postgres server, not per database.
  electric-test:
    image: electricsql/electric:1.8.1
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://flowdeck:${POSTGRES_PASSWORD:-flowdeck-dev}@postgres:5432/flowdeck_test?sslmode=disable
      ELECTRIC_REPLICATION_STREAM_ID: test
      ELECTRIC_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ELECTRIC_TEST_PORT:-3011}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/v1/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: ${FLOWDECK_IMAGE:-ghcr.io/noamcohen48/flowdeck}:${FLOWDECK_VERSION:-latest}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://flowdeck:${POSTGRES_PASSWORD:-flowdeck-dev}@postgres:5432/flowdeck
      ELECTRIC_URL: http://electric:3000
      # Signs the identity cookie. Optional: left empty, one is generated on first
      # boot and kept on the data volume.
      COOKIE_SECRET: ${COOKIE_SECRET:-}
      ATTACHMENTS_BUDGET_MB: ${ATTACHMENTS_BUDGET_MB:-2048}
      # Set to "true" for a first boot with the fictional Relay data (idempotent: skips when present).
      SEED_DEMO: ${SEED_DEMO:-false}
      # The same bucket the backup service uses; the app keeps suite snapshots
      # there as plain JSON (docs/backup.md § Suite snapshots). Optional.
      BACKUP_REPOSITORY: ${BACKUP_REPOSITORY:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # A public hostname gets a public certificate; `localhost` gets Caddy's own.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  # Off-host backups. Idle with a notice until BACKUP_REPOSITORY is set; then a
  # snapshot on start and one every BACKUP_INTERVAL. Restore with
  # `docker compose exec backup flowdeck-restore latest` — see docs/backup.md.
  backup:
    image: ${FLOWDECK_IMAGE:-ghcr.io/noamcohen48/flowdeck}-backup:${FLOWDECK_VERSION:-latest}
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: flowdeck
      PGPASSWORD: ${POSTGRES_PASSWORD:-flowdeck-dev}
      PGDATABASE: flowdeck
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      BACKUP_KEEP: ${BACKUP_KEEP:---keep-last 3 --keep-daily 7 --keep-weekly 4 --keep-monthly 12}
      BACKUP_LOCAL_KEEP: ${BACKUP_LOCAL_KEEP:-3}
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - data:/data
      - backups:/backups
      # Drop the internal CA's certificate here (any *.pem or *.crt) when the S3
      # endpoint is https with a certificate your own authority signed.
      - ./backup/ca:/etc/flowdeck-backup/ca:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  data:
  backups:
  caddy-data:
  caddy-config:
