<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowdeck — manual testing flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---- Foundations ------------------------------------------------ */
:root{
  --ink:#16202B;
  --ink-2:#3C4B5A;
  --muted:#6B7A88;
  --paper:#EEF1F4;
  --surface:#FFFFFF;
  --line:#D8DEE5;
  --line-soft:#E7EBF0;

  --pass:#1B7A46;
  --fail:#C22F2F;
  --minor:#A66A00;
  --skip:#78868F;

  --dev-a:#5B45C7;
  --dev-b:#0C7F80;
  --dev-c:#A85C10;
  --dev-d:#B23A72;

  --r:6px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.5;
}
a{color:inherit}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--dev-a);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Chrome ------------------------------------------------------ */
.topbar{
  background:var(--ink);color:#E8EDF2;
  padding:0 20px;
  display:flex;align-items:center;gap:22px;
  height:52px;
  position:sticky;top:0;z-index:40;
}
.brand{font-weight:600;letter-spacing:-.01em;font-size:16px;text-decoration:none;white-space:nowrap}
.brand span{color:#8FA3B6;font-weight:400}
.topnav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.topnav a{
  text-decoration:none;padding:6px 11px;border-radius:var(--r);
  color:#AEBECD;font-size:14px;
}
.topnav a:hover{background:#22303F;color:#fff}
.topnav a.on{background:#2E3F51;color:#fff}

.shell{max-width:1080px;margin:0 auto;padding:28px 20px 90px}
.shell.wide{max-width:1240px}

h1{font-size:27px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;font-weight:600}
h2{font-size:19px;letter-spacing:-.01em;margin:34px 0 12px;font-weight:600}
h3{font-size:15px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px;max-width:62ch}
.crumb{color:var(--muted);font-size:13.5px;margin:0 0 8px}
.crumb a{text-decoration:none;border-bottom:1px solid var(--line)}

/* ---- Generic surfaces -------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px 18px}
.row-split{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 13px;border-radius:var(--r);font-weight:500;
}
.btn:hover{border-color:#B9C3CE;background:#FAFBFC}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#22303F}
.btn.sm{padding:4px 9px;font-size:13.5px}

.tag{
  display:inline-block;padding:2px 8px;border-radius:20px;
  background:#EAEEF3;color:var(--ink-2);font-size:12.5px;border:1px solid var(--line-soft);
}
.meta{color:var(--muted);font-size:13.5px}

/* ---- Device identity (the core visual system) --------------------- */
.dev{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:500;color:#fff;
  padding:3px 10px 3px 3px;border-radius:20px;
  white-space:nowrap;
}
.dev i{
  width:19px;height:19px;border-radius:50%;
  background:rgba(255,255,255,.26);
  display:grid;place-items:center;font-style:normal;font-weight:600;font-size:12px;
}
.dev.a{background:var(--dev-a)} .dev.b{background:var(--dev-b)}
.dev.c{background:var(--dev-c)} .dev.d{background:var(--dev-d)}

.dev.ghost{color:var(--ink-2);background:#fff;border:1px solid var(--line)}
.dev.ghost i{color:#fff}
.dev.ghost.a i{background:var(--dev-a)} .dev.ghost.b i{background:var(--dev-b)}
.dev.ghost.c i{background:var(--dev-c)} .dev.ghost.d i{background:var(--dev-d)}

.devbar{
  position:sticky;top:52px;z-index:30;
  background:#F7F9FB;border-bottom:1px solid var(--line);
  padding:9px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.devbar .lbl{font-size:13px;color:var(--muted)}

/* ---- Steps ------------------------------------------------------- */
.flowhead{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin-bottom:18px;
}
.pre{
  margin-top:10px;padding:10px 12px;border-radius:var(--r);
  background:#F5F7F9;border:1px solid var(--line-soft);font-size:14px;
}
.pre b{font-weight:600}

.steps{list-style:none;margin:0;padding:0}

.step{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid var(--line);
  border-radius:var(--r);
  padding:13px 15px 13px 14px;
  margin-bottom:8px;
}
.step.a{border-left-color:var(--dev-a)}
.step.b{border-left-color:var(--dev-b)}
.step.c{border-left-color:var(--dev-c)}
.step.d{border-left-color:var(--dev-d)}
.step.now{box-shadow:0 0 0 2px rgba(91,69,199,.16);border-color:#B7ADE6}
.step.done{background:#FBFCFD}
.step.done .stext{color:var(--ink-2)}

.stop{display:flex;gap:11px;align-items:flex-start}
.kind{
  flex:none;margin-top:2px;width:20px;height:20px;border-radius:5px;
  display:grid;place-items:center;font-size:11px;font-weight:600;
}
.kind.act{background:var(--ink);color:#fff}
.kind.chk{background:#fff;border:1.5px solid var(--ink-2);color:var(--ink-2)}
.stext{margin:0;font-size:15px}
.stext em{font-style:normal;font-weight:600}
.sline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.snum{color:var(--muted);font-size:13px;min-width:22px}

.expect{
  margin:8px 0 0 31px;padding:8px 11px;border-left:2px solid var(--line);
  color:var(--ink-2);font-size:14px;background:#FAFBFC;
}

/* attached tests */
.tests{margin:11px 0 0 31px;border-top:1px dashed var(--line);padding-top:10px}
.tests .cap{font-size:13px;color:var(--muted);margin-bottom:7px}
.trow{
  display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--line-soft);
}
.trow:last-child{border-bottom:0}
.tname{flex:1;font-size:14px}
.tid{color:var(--muted);font-size:12.5px}
.verdicts{display:flex;gap:4px;flex:none}
.v{
  border:1px solid var(--line);background:#fff;border-radius:5px;
  width:30px;height:27px;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:var(--muted);padding:0;
}
.v:hover{border-color:#AEB9C4}
.v.on.pass{background:var(--pass);border-color:var(--pass);color:#fff}
.v.on.fail{background:var(--fail);border-color:var(--fail);color:#fff}
.v.on.minor{background:var(--minor);border-color:var(--minor);color:#fff}
.v.on.skip{background:var(--skip);border-color:var(--skip);color:#fff}

.stepfoot{margin:11px 0 0 31px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{
  margin:9px 0 0 31px;font-size:13.5px;padding:8px 11px;border-radius:var(--r);
  background:#FCF1F1;border:1px solid #F0D2D2;color:#7E2020;
}
.note.min{background:#FDF6E7;border-color:#EEDFBB;color:#6E4A00}
.note.skp{background:#F4F6F7;border-color:#E2E7EA;color:#4E5A63}

/* the loud "new device" banner */
.pickup{
  margin:16px 0 10px;padding:14px 16px;border-radius:var(--r);
  border:2px dashed;display:flex;gap:13px;align-items:center;
}
.pickup.a{border-color:var(--dev-a);background:rgba(91,69,199,.06)}
.pickup.b{border-color:var(--dev-b);background:rgba(12,127,128,.06)}
.pickup.c{border-color:var(--dev-c);background:rgba(168,92,16,.06)}
.pickup.d{border-color:var(--dev-d);background:rgba(178,58,114,.06)}
.pickup .big{font-size:22px;line-height:1}
.pickup h3{margin:0 0 2px}
.pickup p{margin:0;font-size:13.5px;color:var(--ink-2)}

.hand{
  margin:18px 0 10px;display:flex;align-items:center;gap:10px;
  color:var(--muted);font-size:13.5px;
}
.hand:before,.hand:after{content:"";flex:1;height:1px;background:var(--line)}

/* ---- Status pills ------------------------------------------------ */
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
  padding:3px 10px;border-radius:20px;border:1px solid;
}
.pill.pass{color:var(--pass);border-color:#B9DCC7;background:#EDF7F1}
.pill.fail{color:var(--fail);border-color:#F0C9C9;background:#FCF0F0}
.pill.minor{color:var(--minor);border-color:#EBD9B0;background:#FCF6E9}
.pill.skip{color:var(--skip);border-color:#DDE3E7;background:#F4F6F8}
.pill.open{color:var(--ink-2);border-color:var(--line);background:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* ---- Tables ------------------------------------------------------ */
table{width:100%;border-collapse:collapse;background:var(--surface)}
th{
  text-align:left;font-weight:600;font-size:13px;color:var(--muted);
  padding:9px 14px;border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:14.5px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFC}
.tbl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.uncov td{background:#FCF1F1}
.uncov td:first-child{box-shadow:inset 3px 0 0 var(--fail)}
.uncov tr:hover td{background:#FBECEC}

/* ---- Misc -------------------------------------------------------- */
.kpi{display:flex;gap:26px;flex-wrap:wrap;padding:16px 18px}
.kpi div b{display:block;font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.kpi div span{font-size:13px;color:var(--muted)}

.bar{height:7px;border-radius:4px;background:#E4E9EE;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:var(--pass)} .bar .f{background:var(--fail)}
.bar .m{background:var(--minor)} .bar .s{background:var(--skip)}

.runfoot{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.runfoot .bar{flex:1;min-width:180px}

dialog{
  border:1px solid var(--line);border-radius:8px;padding:0;max-width:460px;width:92%;
  box-shadow:0 18px 50px rgba(22,32,43,.22);
}
dialog::backdrop{background:rgba(22,32,43,.42)}
dialog .pad{padding:18px}
dialog h3{font-size:17px;margin-bottom:3px}
textarea,input[type=text],select{
  width:100%;font-family:inherit;font-size:14px;padding:8px 10px;
  border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--ink);
}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13.5px;color:var(--ink-2);margin:12px 0 5px}
.drop{
  border:1px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;
  color:var(--muted);font-size:13.5px;background:#FAFBFC;
}
.radio{display:flex;gap:8px;margin-top:6px}
.radio button{flex:1;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.radio button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.radio b{display:block;font-size:14px}
.radio span{font-size:12.5px;color:var(--muted)}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}


/* single-file additions */
.devbar-inline{
  position:sticky;top:52px;z-index:30;
  background:#F7F9FB;border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;margin:0 0 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.devbar-inline .lbl{font-size:13px;color:var(--muted)}
.trow .note{margin-left:0;margin-top:7px}
.topnav button{border:0;background:none;padding:6px 11px;border-radius:var(--r);color:#AEBECD;font-size:14px}
.topnav button:hover{background:#22303F;color:#fff}
.topnav button.on{background:#2E3F51;color:#fff}
button.brand{border:0;background:none;color:#E8EDF2;padding:0;text-align:left}
.lnk{cursor:pointer;border-bottom:1px solid var(--line)}
.lnk:hover{border-bottom-color:var(--ink-2)}
.tname{min-width:0}
@media(max-width:640px){
  .shell{padding:20px 14px 120px}
  .verdicts{flex-wrap:wrap}
  .topbar{gap:10px;height:auto;padding:8px 14px;flex-wrap:wrap;position:static}
  .devbar-inline{top:0}
  .runfoot .legend{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="brand" data-go="overview">Flowdeck <span>/ Relay</span></button>
  <nav class="topnav">
    <button data-v="overview"  data-go="overview">Overview</button>
    <button data-v="tests"     data-go="tests">Tests</button>
    <button data-v="templates" data-go="templates">Templates</button>
    <button data-v="day"       data-go="day">Testing day</button>
    <button data-v="run"       data-go="run">Run a flow</button>
  </nav>
</header>

<main class="shell" id="view"></main>

<dialog id="failDlg"><div class="pad">
  <h3>Report a failure</h3>
  <p class="meta" id="failSub" style="margin:0"></p>
  <label class="f">What went wrong?</label>
  <textarea id="failNote" placeholder="Reaction count showed 2 on the iPhone and 1 on the Pixel."></textarea>
  <label class="f">Screenshot</label>
  <div class="drop">Drop an image here, or paste from the clipboard</div>
  <label class="f">Can you keep going?</label>
  <div class="radio" id="blockPick">
    <button data-b="0" class="on"><b>Yes, carry on</b><span>The rest of the flow still works</span></button>
    <button data-b="1"><b>No, I'm stuck</b><span>Remaining steps become blocked</span></button>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
    <button class="btn" id="failCancel">Cancel</button>
    <button class="btn primary" id="failSave">Save report</button>
  </div>
</div></dialog>

<dialog id="skipDlg"><div class="pad">
  <h3>Mark the test as wrong</h3>
  <p class="meta" style="margin:0">This is not a product bug. The test itself no longer matches reality.</p>
  <label class="f">What is wrong with it?</label>
  <textarea id="skipNote" placeholder="The settings screen was redesigned in 4.2 — there is no Appearance section any more."></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
    <button class="btn" id="skipCancel">Cancel</button>
    <button class="btn primary" id="skipSave">Save</button>
  </div>
</div></dialog>

<script>
/* Static demo data. No persistence — reload resets everything. */

const DEVICES = {
  A: { key:'A', name:'Pixel 8', note:'Android, primary account' },
  B: { key:'B', name:'iPhone 13', note:'iOS, same account' },
  C: { key:'C', name:'Chrome on laptop', note:'Web app, same account' },
  D: { key:'D', name:'Second laptop', note:'Signed in as Dana (other account)' }
};

const PRODUCTS = [
  { id:'relay',  name:'Relay',          blurb:'Team messaging with file sync across phone, tablet and web.' },
  { id:'beacon', name:'Beacon Console', blurb:'Admin console for provisioning Relay workspaces.' }
];

/* ---- Test library (assertions only — no steps) ---------------------- */
const TESTS = [
  { id:'T-01', v:4, title:'Fresh install opens on the welcome screen',        expect:'No cached account is shown; the sign-in button is enabled.', tags:['onboarding'] },
  { id:'T-02', v:2, title:'Sign-in rejects a wrong password',                 expect:'An inline error appears under the password field. The field is not cleared.', tags:['onboarding','auth'] },
  { id:'T-03', v:7, title:'Sign-in succeeds with valid credentials',          expect:'The channel list loads within 3 seconds and shows the workspace name in the header.', tags:['onboarding','auth'] },
  { id:'T-04', v:1, title:'Workspace name renders in the header',             expect:'Full name, not truncated, on a 6" screen.', tags:['ui'] },
  { id:'T-05', v:3, title:'Sending a message shows it optimistically',        expect:'The message appears in the thread immediately with a pending clock icon.', tags:['messaging'] },
  { id:'T-06', v:3, title:'Sent message is confirmed',                        expect:'The clock icon becomes a single check within 2 seconds.', tags:['messaging'] },
  { id:'T-07', v:5, title:'Message arrives on a second device',               expect:'The message appears on the other signed-in device without a manual refresh.', tags:['messaging','sync'] },
  { id:'T-08', v:1, title:'Read receipt updates on the sender device',        expect:'The single check becomes a double check once the recipient opens the thread.', tags:['messaging','sync'] },
  { id:'T-09', v:2, title:'Typing indicator appears for the recipient',       expect:'"Dana is typing…" shows under the thread header and clears after 5 seconds of inactivity.', tags:['messaging'] },
  { id:'T-10', v:1, title:'Emoji reaction syncs across devices',              expect:'The reaction and its count are identical on both devices.', tags:['messaging','sync'] },
  { id:'T-11', v:6, title:'Editing a message marks it as edited',             expect:'The text updates everywhere and an "edited" label appears next to the timestamp.', tags:['messaging'] },
  { id:'T-12', v:2, title:'Deleting a message removes it for everyone',       expect:'The message is replaced by "Message deleted" on every device in the thread.', tags:['messaging','sync'] },
  { id:'T-13', v:3, title:'Image attachment uploads with a progress bar',     expect:'A determinate progress bar runs to 100%, then the thumbnail renders.', tags:['files'] },
  { id:'T-14', v:1, title:'Attachment opens in the full-screen viewer',       expect:'Pinch-to-zoom works and the download button is visible.', tags:['files','ui'] },
  { id:'T-15', v:4, title:'Large file over the limit is rejected',            expect:'Upload is blocked before it starts, with a message naming the 100 MB limit.', tags:['files','limits'] },
  { id:'T-16', v:2, title:'Downloaded file keeps its original filename',      expect:'The saved file matches the uploaded name, including spaces and extension.', tags:['files'] },
  { id:'T-17', v:1, title:'Push notification arrives when the app is closed', expect:'A notification with the sender name and message preview appears within 10 seconds.', tags:['notifications'] },
  { id:'T-18', v:3, title:'Tapping a notification opens the right thread',    expect:'The app opens directly to the thread, scrolled to the new message.', tags:['notifications'] },
  { id:'T-19', v:2, title:'Muting a channel stops notifications',            expect:'No banner or sound for new messages in that channel; the badge still increments.', tags:['notifications','settings'] },
  { id:'T-20', v:1, title:'Messages sent offline are queued',                expect:'The message shows a pending state and stays in the thread while offline.', tags:['sync','offline'] },
  { id:'T-21', v:2, title:'Queued messages send on reconnect',               expect:'All queued messages send in their original order once connectivity returns.', tags:['sync','offline'] },
  { id:'T-22', v:1, title:'Offline banner appears and clears',               expect:'"You are offline" shows under the header and disappears within 5 seconds of reconnecting.', tags:['sync','offline','ui'] },
  { id:'T-23', v:1, title:'Sign-out clears local message cache',             expect:'After signing out and back in as another user, no previous messages are visible.', tags:['auth','security'] },
  { id:'T-24', v:1, title:'Dark mode applies to the whole thread view',      expect:'No light-themed elements remain, including the attachment viewer.', tags:['ui','settings'] },
  { id:'T-25', v:1, title:'Search returns messages from an archived channel',expect:'Archived results appear under a separate heading and open read-only.', tags:['search'] }
];

/* ---- Templates ------------------------------------------------------ */
const TEMPLATES = [
  {
    id:'tpl-regression',
    name:'Monthly regression — fresh install',
    blurb:'The full pass we run on release week, starting from a wiped device.',
    status:'active',
    flows:[
      {
        id:'f1', name:'First run and sign-in', owner:'Yuval', state:'done', mins:12,
        pre:'Relay uninstalled from the Pixel. You have valid credentials for the QA workspace.',
        steps:[
          { d:'A', k:'act', t:'Install the release build on the Pixel and open it.' },
          { d:'A', k:'chk', t:'Look at the first screen.', e:'Welcome screen, no cached account, sign-in enabled.', tests:['T-01'] },
          { d:'A', k:'act', t:'Enter the QA email and a deliberately wrong password, then tap Sign in.' },
          { d:'A', k:'chk', t:'Check the error handling.', e:'Inline error under the password field; field keeps its text.', tests:['T-02'] },
          { d:'A', k:'act', t:'Correct the password and tap Sign in.' },
          { d:'A', k:'chk', t:'Watch the channel list load.', e:'Loads under 3s; workspace name in the header, not truncated.', tests:['T-03','T-04'] },
          { d:'A', k:'act', t:'Open Settings → Appearance and switch to Dark.' },
          { d:'A', k:'chk', t:'Return to a thread and inspect every surface.', e:'No light-themed elements anywhere, viewer included.', tests:['T-24'] }
        ]
      },
      {
        id:'f2', name:'Messaging across two devices', owner:'Noa', state:'running', mins:20,
        pre:'Signed in on the Pixel from the previous flow. Have the iPhone nearby but leave it locked for now.',
        steps:[
          { d:'A', k:'act', t:'Open the #qa-sandbox channel.' },
          { d:'A', k:'act', t:'Send the message "ping 1".' },
          { d:'A', k:'chk', t:'Watch the message as it sends.', e:'Appears immediately with a pending clock, then a single check within 2s.', tests:['T-05','T-06'] },
          { d:'B', k:'act', t:'Unlock the iPhone, sign in with the same account and open #qa-sandbox.', intro:true },
          { d:'B', k:'chk', t:'Look for the message you just sent.', e:'"ping 1" is present without pulling to refresh.', tests:['T-07'] },

/* Which templates cover which test (computed) */
function coverageMap(){
  const m = {};
  TEMPLATES.forEach(tpl => tpl.flows.forEach(f => f.steps.forEach(s =>
    (s.tests||[]).forEach(id => { (m[id] = m[id] || []).includes(tpl.name) || m[id].push(tpl.name); })
  )));
  return m;
}
function testById(id){ return TESTS.find(t => t.id === id); }
function flowById(tplId, fId){
  const tpl = TEMPLATES.find(t => t.id === tplId);
  return { tpl, flow: tpl.flows.find(f => f.id === fId) };
}
const VERDICT_LABEL = { pass:'Pass', fail:'Fail', minor:'Minor issue', skip:'Skipped — test is wrong' };

<script>

/* ---------- shared bits ---------- */

const cov = coverageMap();

const devChip = (d, ghost) =>

/* ---------- overview ---------- */

/* ---------- template authoring ---------- */
function vTemplate(){
  const tpl = TEMPLATES[0], flow = tpl.flows[1];
  const covered = new Set(tpl.flows.flatMap(f=>f.steps.flatMap(s=>s.tests||[]))).size;

  const flowlist = tpl.flows.map(f => {
    const devs = [...new Set(f.steps.map(s=>s.d))];

    </div>`;
  }).join('');

  const steps = flow.steps.map((s,i) => {
    const d = s.d.toLowerCase(), ts = s.tests||[];
    const intro = s.intro ? `<li class="pickup ${d}">
        <span class="big">＋</span>
        <div><h3>Bring in ${DEVICES[s.d].name}</h3>
          <p>${DEVICES[s.d].note}. From here on, steps in this colour happen on ${DEVICES[s.d].name}.</p></div>

    const rows = ts.map(id => `<div class="trow">
        <span class="tid">${id}</span><span class="tname">${testById(id).title}</span>
        <button class="btn sm">Unmark</button></div>`).join('');
    return intro + `<li class="step ${d}">
      <div class="stop">
        <span class="snum">${i+1}</span>
        <span class="kind ${s.k==='act'?'act':'chk'}">${s.k==='act'?'▸':'◉'}</span>
        <div style="flex:1">
          <div class="sline">${devChip(s.d,true)}<span class="meta">${s.k==='act'?'Action':'Check'}</span></div>
          <p class="stext">${s.t}</p>
        </div>
        <button class="btn sm">Edit</button>
      </div>
      ${s.e?`<div class="expect"><b>Expected:</b> ${s.e}</div>`:''}
      <div class="tests">
        <div class="cap">${ts.length?'Tests marked here':'No tests marked on this step'}</div>
        ${rows}<button class="btn sm" style="margin-top:8px">＋ Mark a test</button>

  }).join('');

  return `

    <button class="btn sm">See what it misses</button>
  </div></div>

  <h2>Flows</h2>
  <div class="stack">${flowlist}</div>

  <h2>Editing: Messaging across two devices</h2>
  <div class="flowhead">
    <div class="row-split">
      <div style="flex:1;min-width:240px"><input type="text" value="Messaging across two devices" style="font-weight:600;font-size:16px"></div>
      <span class="meta">~20 min · marks 8 tests</span>
    </div>
    <div class="pre" style="margin-top:12px"><b>Before you start:</b> ${flow.pre}</div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="meta">Devices used:</span>
      ${[...new Set(flow.steps.map(s=>s.d))].map(d=>devChip(d)).join('')}

  </div>
  <p class="meta" style="margin-top:26px">A test can be marked in more than one flow. When that happens, the worst result of the day wins on the dashboard.</p>`;
}

/* ---------- testing day ---------- */
function vDay(){
  const tpl = TEMPLATES[0];
  const label = { done:'Finished', running:'In progress', open:'Unclaimed' };
  const list = tpl.flows.map(f => {
    const devs = [...new Set(f.steps.map(s=>s.d))];
    const n = f.steps.reduce((a,s)=>a+((s.tests||[]).length),0);
    const done = f.steps.filter(s=>(s.tests||[]).some(id=>RUN.results[id])).length;
    const pct = f.state==='done' ? 100 : Math.round(done/f.steps.length*100);
    const cta = f.state==='open'
      ? `<button class="btn primary" onclick="go('run')">Claim flow</button>`
      : f.state==='running'
        ? `<button class="btn primary" onclick="go('run')">Continue</button>`
        : `<button class="btn" onclick="go('run')">View results</button>`;
    return `<div class="panel pad">
      <div class="row-split">

}

/* ---------- run (the tester's screen) ---------- */
const runFlow = TEMPLATES[0].flows[1];
const runState = JSON.parse(JSON.stringify(RUN.results));
let blockedFrom = null, pending = null;

function activeDevices(upto){
  const seen = [];
  runFlow.steps.slice(0, upto+1).forEach(s => seen.includes(s.d) || seen.push(s.d));
  return seen;
}
function firstOpenIndex(){
  for (let i=0;i<runFlow.steps.length;i++){
    const ts = runFlow.steps[i].tests||[];
    if (ts.length && ts.some(id => !runState[id])) return i;
  }
  return runFlow.steps.length-1;
}

function vRun(){
  return `
  <p class="crumb"><span class="lnk" data-go="day">Testing day · 10 September</span> › Messaging across two devices</p>
  <div class="flowhead">
    <div class="row-split">
      <div><h1 style="font-size:22px">Messaging across two devices</h1>

      <button class="btn">Abandon flow</button>
    </div>
    <div class="pre"><b>Before you start:</b> ${runFlow.pre}</div>
  </div>
  <div id="devbar" class="devbar-inline"></div>
  <ol class="steps" id="steps"></ol>
  <div class="hand">End of flow</div>
  <div style="text-align:center"><button class="btn primary">Finish flow</button></div>

  <div class="runfoot">
    <span id="count" class="meta"></span>
    <div class="bar" id="fbar"></div>
    <div class="legend">
      <span><span class="dot" style="color:var(--pass)"></span>Pass</span>
      <span><span class="dot" style="color:var(--fail)"></span>Fail</span>
      <span><span class="dot" style="color:var(--minor)"></span>Minor</span>
      <span><span class="dot" style="color:var(--skip)"></span>Skipped</span>
    </div>
  </div>`;
}

function drawRun(){
  const now = firstOpenIndex();
  document.getElementById('devbar').innerHTML =
    `<span class="lbl">In your hands:</span>` + activeDevices(now).map(d=>devChip(d)).join('');

  document.getElementById('steps').innerHTML = runFlow.steps.map((s,i)=>{
    const d = s.d.toLowerCase(), ts = s.tests||[];
    const settled = ts.length && ts.every(id=>runState[id]);
    const blocked = blockedFrom !== null && i > blockedFrom;

    const intro = s.intro ? `<li class="pickup ${d}">
        <span class="big">＋</span>
        <div><h3>Pick up ${DEVICES[s.d].name}</h3>
          <p>${DEVICES[s.d].note}. Everything in this colour from here on happens on ${DEVICES[s.d].name}.</p></div>
        <span style="margin-left:auto">${devChip(s.d)}</span></li>` : '';

    const rows = ts.map(id=>{
      const t = testById(id), r = runState[id];
      const btns = ['pass','fail','minor','skip'].map(v =>
        `<button class="v ${v} ${r&&r.v===v?'on':''}" data-t="${id}" data-v="${v}" title="${VERDICT_LABEL[v]}">${SYM[v]}</button>`).join('');
      const note = r && r.note
        ? `<div class="note ${r.v==='minor'?'min':r.v==='skip'?'skp':''}">${r.note}</div>` : '';
      return `<div class="trow">
        <span class="tid">${id}<span class="meta"> v${t.v}</span></span>
        <span class="tname">${t.title}<br><span class="meta">${t.expect}</span>${note}</span>
        <span class="verdicts">${btns}</span></div>`;
    }).join('');

    return intro + `<li class="step ${d} ${i===now&&!blocked?'now':''} ${settled?'done':''}" style="${blocked?'opacity:.45':''}">
      <div class="stop">
        <span class="snum">${i+1}</span>
        <span class="kind ${s.k==='act'?'act':'chk'}">${s.k==='act'?'▸':'◉'}</span>
        <div style="flex:1">
          <div class="sline">${devChip(s.d,true)}<span class="meta">${s.k==='act'?'Do this':'Check this'}</span>
            ${blocked?'<span class="pill skip"><span class="dot"></span>Blocked</span>':''}</div>
          <p class="stext">${s.t}</p>
        </div>
      </div>
      ${s.e?`<div class="expect"><b>Expected:</b> ${s.e}</div>`:''}
      ${ts.length
        ? `<div class="tests"><div class="cap">Verifies ${ts.length} test${ts.length>1?'s':''}</div>${rows}</div>
           <div class="stepfoot"><button class="btn sm" data-all="${i}">Pass all</button><span class="meta">or mark each one</span></div>`
        : `<div class="stepfoot"><button class="btn sm" data-done="${i}">Done</button><span class="meta">nothing to verify here</span></div>`}
    </li>`;
  }).join('');

  const all = runFlow.steps.flatMap(s=>s.tests||[]);
  const c = v => all.filter(id=>runState[id] && runState[id].v===v).length;
  const n = all.length, left = n - all.filter(id=>runState[id]).length;
  document.getElementById('count').textContent =
    `${c('pass')} passed · ${c('fail')} failed · ${c('minor')} minor · ${c('skip')} skipped · ${left} to go`;
  document.getElementById('fbar').innerHTML =
    `<i class="p" style="width:${c('pass')/n*100}%"></i><i class="f" style="width:${c('fail')/n*100}%"></i>`+
    `<i class="m" style="width:${c('minor')/n*100}%"></i><i class="s" style="width:${c('skip')/n*100}%"></i>`;
}


/* delegated interactions (bound once) */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-go]');
  if (nav){ go(nav.dataset.go); return; }
  const v = e.target.closest('[data-v]');
  if (v){
    const id = v.dataset.t, verdict = v.dataset.v;
    if (verdict==='fail'){ openFail(id); return; }
    if (verdict==='skip'){ openSkip(id); return; }
    runState[id] = { v: verdict };
    drawRun(); return;
  }
  const all = e.target.closest('[data-all]');
  if (all){
    (runFlow.steps[+all.dataset.all].tests||[]).forEach(id => runState[id] = { v:'pass' });
    drawRun(); return;
  }
});

function openFail(id){
  pending = id;
  document.getElementById('failSub').textContent = `${id} · ${testById(id).title}`;
  document.getElementById('failNote').value = '';
  document.querySelectorAll('#blockPick button').forEach((b,i)=>b.classList.toggle('on', i===0));
  document.getElementById('failDlg').showModal();
}
function openSkip(id){
  pending = id;
  document.getElementById('skipNote').value = '';
  document.getElementById('skipDlg').showModal();
}


document.getElementById('blockPick').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#blockPick button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
});
document.getElementById('failCancel').onclick = () => document.getElementById('failDlg').close();
document.getElementById('skipCancel').onclick = () => document.getElementById('skipDlg').close();
document.getElementById('failSave').onclick = () => {
  const blocking = document.querySelector('#blockPick button.on').dataset.b === '1';
  runState[pending] = { v:'fail', note: document.getElementById('failNote').value || 'No description given.', blocking };
  if (blocking) blockedFrom = runFlow.steps.findIndex(s => (s.tests||[]).includes(pending));
  document.getElementById('failDlg').close(); drawRun();
};
document.getElementById('skipSave').onclick = () => {
  runState[pending] = { v:'skip', note: document.getElementById('skipNote').value || 'Marked as no longer valid.' };
  document.getElementById('skipDlg').close(); drawRun();
};

route();
</script>
</body>
</html>
