name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://flowdeck:flowdeck-dev@localhost:54321/flowdeck
      ELECTRIC_URL: http://localhost:3010

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The API client is generated from the server's OpenAPI document. If the
      # committed copy is stale, the web app is typechecking against a contract
      # the server no longer has.
      - name: API client is up to date
        run: bun run api:generate && git diff --exit-code packages/api-client

      - name: Typecheck
        run: bun run typecheck

      - name: Build the web app
        run: bun run --cwd apps/web build

      # The same compose file that runs in development and production, rather
      # than GitHub service containers: those start in parallel with no ordering
      # and no way to pass wal_level=logical, so Electric would come up against a
      # Postgres it cannot replicate from. --wait blocks on the healthchecks.
      - name: Start Postgres and Electric
        run: docker compose up -d --wait postgres electric

      # Migrate and seed before the tests, because the API, shape-proxy and
      # derived-state tests run against the real services on purpose — a CHECK
      # that does not fire, a view Electric cannot sync, and a where clause that
      # does not filter are exactly what a mock cannot catch.
      - name: Migrate
        run: bun run db:migrate

      - name: Seed
        run: bun run db:seed

      - name: Tests
        run: bun test

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 60
