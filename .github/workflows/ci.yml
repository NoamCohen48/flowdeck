name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql://flowdeck:flowdeck-dev@localhost:54321/flowdeck
      ELECTRIC_URL: http://localhost:3010

    steps:
      - uses: actions/checkout@v7

      # The version in package.json's packageManager, the same one the image uses.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # The API client is generated from the server's OpenAPI document. If the
      # committed copy is stale, the web app is typechecking against a contract
      # the server no longer has.
      - name: API client is up to date
        run: bun run docs:api && git diff --exit-code packages/api-client docs/openapi.json

      - name: Typecheck
        run: bun run typecheck

      - name: Build the web app
        run: bun run --cwd apps/web build

      # The example suite in docs/ is what people copy; it must pass its own rules.
      - name: Build the CLI, and lint the example suite with it
        run: |
          bun run --cwd apps/cli build
          (cd docs/examples/relay && ../../../apps/cli/dist/flowdeck lint)

      # The same compose file that runs in development and production, rather
      # than GitHub service containers: those start in parallel with no ordering
      # and no way to pass wal_level=logical, so Electric would come up against a
      # Postgres it cannot replicate from. --wait blocks on the healthchecks.
      - name: Start Postgres and Electric
        run: docker compose up -d --wait postgres electric

      # Migrate and seed before the tests, because the API, shape-proxy and
      # derived-state tests run against the real services on purpose — a CHECK
      # that does not fire, a view Electric cannot sync, and a where clause that
      # does not filter are exactly what a mock cannot catch.
      - name: Migrate
        run: bun run db:migrate

      - name: Seed
        run: bun run db:seed

      - name: Tests
        run: bun test

      # Two browsers on one testing day: a claim and a verdict in one must land
      # on the other's board with no reload. The API tests cannot see this; only
      # a browser holding a real shape stream can.
      - name: Install Chromium
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: End to end
        run: bun run --cwd apps/web e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results
          if-no-files-found: ignore

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 60

  # The images as they ship, run as they ship: the whole compose stack behind
  # Caddy, from images built here, with nothing from the checkout mounted in
  # but the Caddyfile. Catches what the tests above cannot: a file the image
  # forgot, a migration that only works with dev dependencies, a non-root user
  # that cannot write its volume. On main, the same images go out as :edge.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    env:
      FLOWDECK_VERSION: ci
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - uses: actions/checkout@v7

      # Image names are lowercase; the owner's login need not be.
      - name: Image name
        run: echo "FLOWDECK_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowdeck" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.FLOWDECK_IMAGE }}:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build the backup image
        uses: docker/build-push-action@v7
        with:
          context: backup
          load: true
          tags: ${{ env.FLOWDECK_IMAGE }}-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: Start the whole stack
        run: |
          cp .env.example .env
          docker compose up -d --wait --no-build

      - name: Smoke test through Caddy
        run: |
          curl -fsk https://localhost/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsk https://localhost/api | grep -q '"name":"Flowdeck"'
          curl -fsk https://localhost/ | grep -q '<div id="root">'
          curl -fsk https://localhost/api/products | grep -q '"slug":"relay"'
          curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/no-such-route | grep -qx 404
          # A write, so the volume and the cookie secret are known to be writable.
          curl -fsk -X POST https://localhost/api/products \
            -H 'content-type: application/json' -H 'x-flowdeck-actor: CI' \
            -d '{"name":"Smoke"}' | grep -q '"slug":"smoke"'
          docker compose exec -T app sh -c 'test -s /data/cookie-secret && id -u' | grep -qx 1000

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 80

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Emulate arm64
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v4

      # Multi-arch; the amd64 half comes from the cache the builds above filled.
      - name: Publish :edge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for target in "app ." "backup backup"; do
            set -- $target
            suffix=$([ "$1" = backup ] && echo -backup || true)
            docker buildx build "$2" --push \
              --platform linux/amd64,linux/arm64 \
              --build-arg VERSION=edge --build-arg REVISION=${{ github.sha }} \
              --cache-from type=gha,scope=$1 \
              -t "$FLOWDECK_IMAGE$suffix:edge" \
              -t "$FLOWDECK_IMAGE$suffix:sha-${GITHUB_SHA::7}"
          done
