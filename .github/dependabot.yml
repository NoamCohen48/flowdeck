# Weekly, grouped, so updates arrive as one reviewable PR per ecosystem rather
# than a stream. Each runs through CI like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /backup]
    schedule: { interval: weekly }
